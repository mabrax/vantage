<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title description">
  <title id="title">Milestone 2 rich Markdown response map</title>
  <desc id="description">Ordered Codex text enters the Vantage transcript, where a safe Markdown renderer presents prose, tables, links, and code snippets. Completed Mermaid and sanitized SVG fences become inline visuals. Packaged quality assurance verifies the complete path. Interactive generative UI, rich tool activity, remote active content, and other workspace surfaces remain future work.</desc>
  <defs>
    <style>
      :root { color-scheme: light dark; }
      .canvas { fill: #f8fafc; }
      .group { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .group-label { fill: #334155; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; }
      .node { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .existing { fill: #f8fafc; stroke: #64748b; }
      .primary { fill: #eff6ff; stroke: #2563eb; }
      .visual { fill: #f5f3ff; stroke: #7c3aed; }
      .qa { fill: #ecfdf5; stroke: #059669; }
      .guard { fill: #fff7ed; stroke: #ea580c; }
      .future { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
      .text { fill: #0f172a; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .subtext { fill: #475569; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; }
      .issue { fill: #2563eb; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .future-label { fill: #64748b; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .phase { fill: #64748b; font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .guard-edge { fill: none; stroke: #ea580c; stroke-width: 2; stroke-dasharray: 5 5; }
      .future-edge { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
      .marker { fill: #475569; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0d1117; }
        .group, .node, .future { fill: #161b22; }
        .group, .existing, .node { stroke: #8b949e; }
        .existing { fill: #161b22; stroke: #8b949e; }
        .group-label, .text { fill: #f0f6fc; }
        .subtext { fill: #b1bac4; }
        .phase, .future-label { fill: #8b949e; }
        .primary { fill: #0d2440; stroke: #58a6ff; }
        .visual { fill: #241640; stroke: #a371f7; }
        .qa { fill: #0f2d22; stroke: #3fb950; }
        .guard { fill: #351b0c; stroke: #f0883e; }
        .issue { fill: #58a6ff; }
        .edge { stroke: #8b949e; }
        .guard-edge { stroke: #f0883e; }
        .future, .future-edge { stroke: #6e7681; }
        .marker { fill: #8b949e; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="marker" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1440" height="860" rx="16"/>

  <text class="phase" x="54" y="54">Packaged response path</text>

  <rect class="node existing" x="50" y="150" width="220" height="104" rx="14"/>
  <text class="text" x="160" y="190">Ordered Codex text</text>
  <text class="subtext" x="160" y="218">Existing streamed deltas</text>

  <rect class="group" x="320" y="88" width="1068" height="300" rx="20"/>
  <text class="group-label" x="350" y="128">Vantage transcript</text>

  <rect class="node primary" x="360" y="166" width="240" height="128" rx="14"/>
  <text class="text" x="480" y="205">Safe Markdown</text>
  <text class="text" x="480" y="227">presentation</text>
  <text class="subtext" x="480" y="252">Prose · tables · links</text>
  <text class="issue" x="480" y="278">Issue #18</text>

  <rect class="node primary" x="630" y="166" width="220" height="128" rx="14"/>
  <text class="text" x="740" y="205">Code snippets</text>
  <text class="subtext" x="740" y="230">Inline · fenced · copy</text>
  <text class="issue" x="740" y="278">Issue #18</text>

  <rect class="node visual" x="880" y="166" width="220" height="128" rx="14"/>
  <text class="text" x="990" y="205">Inline visuals</text>
  <text class="subtext" x="990" y="230">Mermaid · sanitized SVG</text>
  <text class="issue" x="990" y="278">Issue #19</text>

  <rect class="node qa" x="1130" y="166" width="220" height="128" rx="14"/>
  <text class="text" x="1240" y="205">Packaged QA</text>
  <text class="subtext" x="1240" y="230">Render · attack · regress</text>
  <text class="issue" x="1240" y="278">Exit issue #20</text>

  <path class="edge" d="M 270 202 H 360"/>
  <path class="edge" d="M 600 230 H 630"/>
  <path class="edge" d="M 850 230 H 880"/>
  <path class="edge" d="M 1100 230 H 1130"/>

  <rect class="node guard" x="500" y="430" width="760" height="106" rx="16"/>
  <text class="text" x="880" y="468">Trusted presentation boundary</text>
  <text class="subtext" x="880" y="495">Raw source retained · sanitized DOM · no script · no remote fetch · CSP preserved</text>
  <text class="subtext" x="880" y="517">Incomplete or rejected rich content remains readable source</text>

  <path class="guard-edge" d="M 480 294 V 410 H 650 V 430"/>
  <path class="guard-edge" d="M 740 294 V 430"/>
  <path class="guard-edge" d="M 990 294 V 430"/>

  <text class="phase" x="54" y="614">Deferred beyond this milestone</text>

  <rect class="node future" x="50" y="660" width="300" height="120" rx="14"/>
  <text class="text" x="200" y="700">Interactive generative UI</text>
  <text class="subtext" x="200" y="728">Typed application components</text>
  <text class="future-label" x="200" y="758">Future vertical</text>

  <rect class="node future" x="385" y="660" width="300" height="120" rx="14"/>
  <text class="text" x="535" y="700">Rich Codex activity</text>
  <text class="subtext" x="535" y="728">Tools · plans · diffs · approvals</text>
  <text class="future-label" x="535" y="758">Future vertical</text>

  <rect class="node future" x="720" y="660" width="300" height="120" rx="14"/>
  <text class="text" x="870" y="700">Active external content</text>
  <text class="subtext" x="870" y="728">Remote media · HTML · scripts</text>
  <text class="future-label" x="870" y="758">Not scheduled</text>

  <rect class="node future" x="1055" y="660" width="335" height="120" rx="14"/>
  <text class="text" x="1222" y="700">Other workspace surfaces</text>
  <text class="subtext" x="1222" y="728">Files · terminal · persistence</text>
  <text class="future-label" x="1222" y="758">Future verticals</text>

  <path class="future-edge" d="M 880 536 V 624 H 200 V 660"/>
  <path class="future-edge" d="M 880 624 H 535 V 660"/>
  <path class="future-edge" d="M 880 624 H 870 V 660"/>
  <path class="future-edge" d="M 880 624 H 1222 V 660"/>

  <text class="subtext" x="720" y="826">Solid nodes are delivered in Milestone 2 · Dashed nodes remain deliberately out of scope</text>
</svg>
